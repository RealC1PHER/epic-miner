# epic-miner — HiveOS custom miner manifest.
# Sourced by HiveOS. Flight-sheet values (CUSTOM_TEMPLATE / CUSTOM_URL / CUSTOM_PASS /
# CUSTOM_USER_CONFIG) are exported by Hive and override the defaults here.

CUSTOM_NAME=epic-miner
CUSTOM_VERSION=2.3.1.fz3
CUSTOM_BUILD=1

CUSTOM_ALGO=randomx

# Rendered miner config + log location
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/$CUSTOM_NAME/epic-miner.toml
CUSTOM_LOG_BASENAME=/var/log/miner/$CUSTOM_NAME/$CUSTOM_NAME
